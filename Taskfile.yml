version: "3"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  install:crates:
    desc: Install dependencies for all Rust workspace packages
    cmds:
      - cargo fetch

  build:
    desc: Build all Rust workspace packages
    cmds:
      - cargo build --workspace

  build:test:
    desc: Precompile Rust workspace checks and test targets
    env:
      CARGO_INCREMENTAL: "0"
    cmds:
      - cargo clippy --workspace --all-features -- -D warnings
      - cargo test --workspace --all-features --no-run

  clean:debug:
    desc: Clean only Rust debug build artifacts
    cmds:
      - cargo clean --profile dev

  format:
    desc: Format all Rust workspace packages
    cmds:
      - task: format:crates

  format:crates:
    desc: Format all Rust workspace packages
    silent: true
    cmds:
      - cargo fmt --all

  lint:crates:
    desc: Run linters on all crates packages
    env:
      CARGO_INCREMENTAL: "0"
    silent: true
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-features -- -D warnings

  test:crates:
    desc: Run all Rust workspace package test suites
    env:
      CARGO_INCREMENTAL: "0"
    cmds:
      - task: lint:crates
      - cargo test --workspace --all-features

  lint:
    desc: Run all linters
    cmds:
      - task: lint:crates
  test:
    desc: Run all workspace lint and unit tests (container tests are ignored)
    cmds:
      - task: test:crates

  test:integration:
    desc: Run ignored PostgreSQL tests using locally prepared images
    cmds:
      - cargo test -p palace-db --test postgres -- --ignored
      - cargo test -p palace-backend --test http -- --ignored

  run:server:
    desc: Run the Palace HTTP server with deployment environment configuration
    cmds:
      - cargo run -p palace-server

  run:test-server:
    desc: Run single-user Palace with a persistent PostgreSQL testcontainer
    cmds:
      - cargo run -p palace-server --features test-server --bin palace-test-server

  test:test-server:
    desc: Verify test server database persistence and fixed-user HTTP access
    cmds:
      - cargo test -p palace-server --features test-server --bin palace-test-server -- --ignored

  test:contract:
    desc: Run ignored Authelia protocol tests using locally prepared images
    cmds:
      - cargo test -p palace-backend authelia_authorization -- --ignored
