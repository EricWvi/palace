<!doctype html>
<html lang="zh-CN">

<!--
  摘星 entry page: a book's contents page. ?kind= picks the list
  (notes / articles / conversations); `/` searches it, `n` starts a note.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摘星</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <script src="ornament.js"></script>
  <script src="shared.js"></script>
  <script src="3-stars-data.js"></script>
  <style>
    a {
      color: inherit;
      text-decoration: none;
    }

    mark {
      background: var(--accent-soft);
      color: inherit;
      border-radius: 2px;
    }

    /*
     * Kinds stand in a column on the left; the contents run on the right,
     * starting at the height of 时刻's date and the reading page's title.
     */
    .contents {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 48px;
      margin-top: 70px;
    }

    .kinds {
      position: sticky;
      top: 32px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: var(--font-display);
      font-size: var(--font-size-lg);
    }

    .kinds button {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--text-3);
    }

    .kinds button:hover {
      color: var(--text-2);
    }

    .kinds button[aria-current="page"] {
      color: var(--text);
    }

    .kinds small {
      font-family: var(--font-ui);
      font-size: var(--font-size-xs);
      color: var(--text-3);
    }

    /* Absent until `/`; an underline rather than a box. */
    .search {
      display: block;
      width: 100%;
      margin: 0 0 24px;
      padding: 6px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-family: var(--font-ui);
      font-size: var(--font-size-md);
    }

    .search:focus {
      border-bottom-color: var(--text-3);
    }

    .search::placeholder {
      color: var(--text-3);
    }

    .search[hidden] {
      display: none;
    }

    .year h2 {
      margin: 0 0 12px;
      color: var(--text-3);
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 400;
    }

    .year+.year h2 {
      margin-top: 40px;
    }

    .year ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* One line per entry, dotted leaders running from the title to its date. */
    .entry {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
    }

    .entry-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: var(--font-size-lg);
    }

    .entry:hover .entry-title {
      color: var(--accent-hover);
    }

    .entry-aside {
      flex: none;
      color: var(--text-3);
      font-size: var(--font-size-xs);
    }

    .leader {
      flex: 1;
      min-width: 24px;
      border-bottom: 1px dotted var(--text-3);
      opacity: .6;
    }

    .entry-date {
      flex: none;
      color: var(--text-3);
      font-size: var(--font-size-xs);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      color: var(--text-3);
      font-size: var(--font-size-sm);
    }

    @media (max-width: 720px) {
      .contents {
        grid-template-columns: 1fr;
        gap: 24px;
        margin-top: 41px;
      }

      .kinds {
        position: static;
        flex-direction: row;
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="sheet">
    <palace-header active="摘星"></palace-header>
    <div class="contents">
      <div class="kinds" id="kinds"></div>
      <div>
        <input class="search" id="search" placeholder="搜索标题与正文" hidden>
        <div id="list"></div>
      </div>
    </div>
  </main>

  <script>
    const { conversations, notes, articles } = globalThis.starsData;
    const params = new URLSearchParams(location.search);

    // Markdown flattened to one line: line markers and fences go, the words stay.
    const plain = (md) => md.replace(/^(#+|>|-|```)\s?/gm, "").replace(/[`*]/g, "").replace(/\s+/g, " ").trim();

    const KINDS = {
      notes: {
        label: "笔记", items: notes,
        href: (n) => `3.2-stars-note.html?note=${n.id}`,
        text: (n) => plain(n.body),
        aside: () => "",
      },
      articles: {
        label: "文章", items: articles,
        href: () => "#",
        text: (a) => a.excerpt,
        aside: (a) => a.site,
      },
      conversations: {
        label: "对话", items: conversations,
        href: () => "2.1-moment-conversation.html",
        text: (c) => c.excerpt,
        aside: (c) => c.source,
      },
    };

    let kind = params.get("kind") in KINDS ? params.get("kind") : "notes";
    let query = "";

    const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
    const highlight = (text) => {
      const safe = esc(text);
      if (!query) return safe;
      const pattern = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp(pattern, "gi"), (m) => `<mark>${m}</mark>`);
    };

    // Searching looks at the body too, but only the title is shown, so a body hit
    // still lists the entry without saying where it matched.
    const matches = (item) => {
      const q = query.toLowerCase();
      return !q || item.title.toLowerCase().includes(q) || KINDS[kind].text(item).toLowerCase().includes(q);
    };

    const kindsEl = document.getElementById("kinds");
    const list = document.getElementById("list");
    const search = document.getElementById("search");

    const renderKinds = () => {
      kindsEl.innerHTML = Object.entries(KINDS).map(([key, k]) =>
        `<button data-kind="${key}" ${key === kind ? 'aria-current="page"' : ""}>${k.label}<small>${k.items.length}</small></button>`).join("");
    };

    const renderList = () => {
      const k = KINDS[kind];
      const rows = k.items.filter(matches).sort((a, b) => b.updated.localeCompare(a.updated));
      if (!rows.length) {
        list.innerHTML = `<p class="empty">没有找到。</p>`;
        return;
      }
      const years = new Map();
      for (const item of rows) {
        const year = item.updated.slice(0, 4);
        if (!years.has(year)) years.set(year, []);
        years.get(year).push(item);
      }
      list.innerHTML = [...years].map(([year, items]) => `
        <section class="year"><h2>${year}</h2><ol>${items.map((item) => {
        const [, m, d] = item.updated.split("-");
        const aside = k.aside(item);
        return `<li><a class="entry" href="${k.href(item)}">
            <span class="entry-title">${highlight(item.title)}</span>
            ${aside ? `<span class="entry-aside">${esc(aside)}</span>` : ""}
            <span class="leader"></span>
            <span class="entry-date">${m}.${d}</span>
          </a></li>`;
      }).join("")}</ol></section>`).join("");
    };

    renderKinds();
    renderList();

    kindsEl.addEventListener("click", (e) => {
      const button = e.target.closest("[data-kind]");
      if (!button) return;
      kind = button.dataset.kind;
      // Replace, not push: switching lists is browsing, and back should leave 摘星.
      params.set("kind", kind);
      history.replaceState(null, "", `?${params}`);
      renderKinds();
      renderList();
    });

    search.addEventListener("input", () => {
      query = search.value.trim();
      renderList();
    });

    document.addEventListener("keydown", (e) => {
      if (e.target === search) {
        if (e.key !== "Escape") return;
        // Escape empties the search first, then puts it away.
        if (search.value) {
          search.value = "";
        } else {
          search.hidden = true;
          search.blur();
        }
        query = "";
        renderList();
        return;
      }
      if (e.target.closest("input, textarea, [contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") {
        e.preventDefault();
        search.hidden = false;
        search.focus();
      }
      if (e.key === "n") location.href = "3.2-stars-note.html?note=new";
    });
  </script>
</body>

</html>
